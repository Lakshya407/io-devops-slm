# IO Coding Agent — Milestone 1
#
# This Compose project is intentionally separate from the existing LiteLLM
# Compose project. It reuses the existing external network and PostgreSQL
# server but never edits or replaces the LiteLLM/Open WebUI configuration.
name: io-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  workspace-init:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /workspaces /exports
        chown -R 10001:10001 /workspaces /exports
        chmod 0770 /workspaces /exports
    volumes:
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/workspaces:/workspaces
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/exports:/exports
    restart: "no"
    logging: *default-logging

  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: ${AGENT_SANDBOX_IMAGE:-io-agent-sandbox:latest}
    command: ["python", "-c", "print('io-agent-sandbox ready')"]
    restart: "no"
    logging: *default-logging

  sandbox-runner:
    build:
      context: ./sandbox
      dockerfile: runner.Dockerfile
    image: io-agent-sandbox-runner:latest
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set in .env}
      AGENT_WORKSPACES_HOST_DIR: ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/workspaces
      SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:-io-agent-sandbox:latest}
      SANDBOX_ALLOW_NETWORK: "false"
      SANDBOX_ENABLE_DOCKER_BUILD: ${AGENT_ENABLE_DOCKER_BUILD:-false}
      SANDBOX_MAX_OUTPUT_BYTES: ${AGENT_MAX_OUTPUT_BYTES:-200000}
      SANDBOX_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
    volumes:
      # The only Docker socket in the deployment. No coding workspace gets it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/workspaces:${IO_AGENT_HOST_ROOT:-/srv/io-agent}/workspaces:ro
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 15s
      retries: 5
    logging: *default-logging
    networks:
      - ai-network

  io-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: io-agent:latest
    env_file:
      - .env
    environment:
      AGENT_WORKSPACES_DIR: /workspaces
      AGENT_REPOS_DIR: /repos
      AGENT_DATASET_EXPORT_DIR: /exports
      AGENT_SANDBOX_URL: http://sandbox-runner:8090
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:?AGENT_DATABASE_URL must be set in .env}
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY must be set in .env}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?LITELLM_API_KEY must be set in .env}
    volumes:
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/workspaces:/workspaces
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/repos:/repos:ro
      - ${IO_AGENT_HOST_ROOT:-/srv/io-agent}/exports:/exports
    ports:
      - "127.0.0.1:${IO_AGENT_PORT:-8091}:8080"
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 5
    logging: *default-logging
    networks:
      - ai-network

networks:
  ai-network:
    # Created by the existing LiteLLM Compose project (project name: litellm).
    external: true
    name: litellm_ai-network
